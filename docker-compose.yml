version: '3.8'

services:
  proxy:
    image: nginx:alpine
    container_name: proxy_service
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cms
      - dba
    networks:
      - app-network

  cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms_service
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mariadb:10.6
    container_name: db_service
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  dba:
    image: adminer:latest
    container_name: dba_service
    environment:
      - ADMINER_DEFAULT_SERVER=db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: